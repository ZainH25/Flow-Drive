name: flow_drive
description: "Flow - Rapid cross-device file transfer with spatial canvas UI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  get: ^4.7.2

  # AWS Amplify — Cognito auth & AppSync GraphQL
  amplify_flutter: ^2.6.0
  amplify_auth_cognito: ^2.6.0
  amplify_api: ^2.6.0

  # Local persistence (onboarding flags, tokens cache)
  shared_preferences: ^2.5.3

  # UI helpers
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/icons/
