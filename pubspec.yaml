name: flow_drive
description: "Flow - Rapid cross-device file transfer with spatial canvas UI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  get: ^4.7.2

  # AWS Amplify — Cognito auth & AppSync GraphQL
  amplify_flutter: ^2.6.0
  amplify_auth_cognito: ^2.6.0
  amplify_api: ^2.6.0

  # Local persistence (onboarding flags, tokens cache)
  shared_preferences: ^2.5.3

  # UI helpers
  smooth_page_indicator: ^1.2.1
  file_picker: ^11.0.3
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  # 13.x pulls permission_handler_android 14 (AGP 9 / Kotlin 2.3) which breaks this project.
  permission_handler: 12.0.1
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/icons/


